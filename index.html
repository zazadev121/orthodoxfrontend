<!doctype html>
<html lang="ckb" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        const saved = localStorage.getItem("theme");
        const themes = ["amethyst", "midnight", "slate", "burgundy", "forest", "ocean", "ivory", "charcoal", "coffee"];
        document.documentElement.dataset.theme = themes.includes(saved) ? saved
          : saved === "light" ? "ivory" : saved === "dark" ? "midnight" : "amethyst";
        const fonts = ["naskh", "kufi", "sans", "vazir", "readex", "nrt", "speda", "rudaw", "nastaliq", "rabar", "unikurd", "bukra"];
        const font = localStorage.getItem("readerFont");
        document.documentElement.dataset.readerFont = fonts.includes(font) ? font : "naskh";
        const size = localStorage.getItem("readerSize");
        if (["0.9", "1", "1.15"].includes(size)) document.documentElement.style.setProperty("--reader-scale", size);
      } catch {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#182e40" />
    <link rel="icon" type="image/jpeg" href="/kurdistan-cross.jpg" />
    <link rel="apple-touch-icon" href="/kurdistan-cross.jpg" />
    <meta
      name="description"
      content="Orthodoxy in Kurdistan — Scripture, the Church Fathers, and Eastern Orthodox learning in Sorani and Kurmanji Kurdish."
    />
    <title>Orthodoxy in Kurdistan | ئۆرتۆدۆکسی لە کوردستان</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
